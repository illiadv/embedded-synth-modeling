name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Install arm-none-eabi-gcc
        uses: carlosperate/arm-none-eabi-gcc-action@v1

      - name: Configure CMake
        run: cmake --preset Debug -DACTIVE_IMPL=wt_lerp

      - name: Build firmware
        run: cmake --build --preset Debug --target f401

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: Firmware
          path: build/Debug/f401.elf

      - name: Cache Renode download
        id: cache-renode
        uses: actions/cache@v4
        with:
          path: ./renode.tar.gz
          key: renode-archive
        
      - name: Download Renode
        if: steps.cache-renode.outputs.cache-hit != 'true'
        run: |
          curl -sSLf -o renode.tar.gz "https://builds.renode.io/renode-latest.linux-portable.tar.gz"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.23"

      - name: Install pyrenode
        run: |
          uv venv
          uv pip install 'pyrenode3[all] @ git+https://github.com/antmicro/pyrenode3.git'

      - name: Run get_waveform.py
        run: |
          export PYRENODE_PATH=./renode.tar.gz
          uv run python3 get_waveform.py --sampling-rate 8000
